name: Readability gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  readability:
    name: Flesch-Kincaid grade check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install textstat
        run: python -m pip install textstat==0.7.4

      - name: Verify textstat is importable
        run: |
          which python
          python -c "import sys; print('executable:', sys.executable)"
          python -m pip show textstat
          python -c "import textstat; print('textstat OK at:', textstat.__file__)"

      - name: Run readability check
        run: |
          python scripts/readability_check.py \
            --public-grade 8 \
            --technical-grade 10 \
            --paths "README.md"
