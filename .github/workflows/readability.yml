name: Readability gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  readability:
    name: Flesch-Kincaid grade check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # textstat 0.7.4 imports the deprecated `pkg_resources` module,
      # which was removed from setuptools 78. Pin to 0.7.13 (latest 0.7.x)
      # which dropped the pkg_resources dependency.
      - name: Install textstat
        run: python -m pip install textstat==0.7.13

      - name: Verify textstat is importable
        run: python -c "import textstat; print('textstat OK:', textstat.__version__)"

      - name: Run readability check
        run: |
          python scripts/readability_check.py \
            --public-grade 8 \
            --technical-grade 10 \
            --paths "README.md"
