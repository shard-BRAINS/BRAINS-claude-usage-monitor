name: Readability gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  readability:
    name: Flesch-Kincaid grade check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # textstat 0.7.4 imports the deprecated `pkg_resources` module,
      # which was removed from setuptools 78. Pin to 0.7.13 (latest 0.7.x)
      # which dropped the pkg_resources dependency.
      - name: Install textstat
        run: python -m pip install textstat==0.7.13

      - name: Verify textstat is importable
        run: python -c "import textstat; print('textstat OK:', textstat.__version__)"

      - name: Run readability check
        run: |
          python scripts/readability_check.py \
            --public-grade 8 \
            --technical-grade 10 \
            --paths "README.md"
