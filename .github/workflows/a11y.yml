name: Accessibility (axe-core + Pa11y)

# Opt-in for repos with a web surface.
# Enable by setting the repository variable HAS_WEB_UI=true
# and providing a STATIC_DIR (default: ./public) or START_URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    name: Should run?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          if [[ "${{ vars.HAS_WEB_UI }}" == "true" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Skipping: set repo variable HAS_WEB_UI=true to enable."
          fi

  axe:
    name: axe-core
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install
        run: npm ci || npm install

      - name: Serve static dir
        run: |
          npx --yes http-server ${{ vars.STATIC_DIR || './public' }} -p 8080 &
          npx --yes wait-on http://localhost:8080

      - name: Run axe
        run: |
          npx --yes @axe-core/cli http://localhost:8080 \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22a,wcag22aa \
            --exit

  pa11y:
    name: Pa11y
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Serve static dir
        run: |
          npx --yes http-server ${{ vars.STATIC_DIR || './public' }} -p 8080 &
          npx --yes wait-on http://localhost:8080

      - name: Run Pa11y
        run: |
          npx --yes pa11y http://localhost:8080 \
            --standard WCAG2AA \
            --runner axe \
            --runner htmlcs
