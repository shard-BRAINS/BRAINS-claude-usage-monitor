name: Release

# Tag-triggered release workflow. Push a tag like `v0.2.4` to:
#   1. Build the VSIX from source.
#   2. Generate an SLSA build provenance attestation (Sigstore-signed).
#   3. Generate SHA256 checksums.
#   4. Create a GitHub Release with the VSIX, the .intoto.jsonl provenance
#      bundle, and the checksum file attached.
#
# Signing uses the GitHub OIDC-issued certificate, so no long-lived secrets
# are required. Consumers can verify with:
#   gh attestation verify <vsix> --repo shard-BRAINS/BRAINS-claude-usage-monitor

on:
  push:
    tags:
      - 'v*.*.*'

permissions: read-all

jobs:
  build:
    name: Build VSIX
    # Matches ci.yml — the lockfile is generated on Windows, so an
    # ubuntu runner trips npm/cli#4828 ("Cannot find module
    # @rollup/rollup-linux-x64-gnu"). Build on Windows; the produced
    # VSIX is platform-agnostic and is consumed by the Linux attest +
    # release jobs via the artifact upload/download mechanism.
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      vsix-name: ${{ steps.package.outputs.name }}
      vsix-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:prod

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          npm run package
          name=$(ls *.vsix | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check VSIX size
        run: npm run package:check

      - name: Compute SHA256
        id: hash
        shell: bash
        run: |
          sha=$(sha256sum "${{ steps.package.outputs.name }}" | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: |
            *.vsix
            SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

  attest:
    name: SLSA build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: .

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "*.vsix"

  release:
    name: Publish GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            *.vsix SHA256SUMS.txt
