name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Check VSIX size
        run: npm run package:check

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-monitor-vsix
          path: "*.vsix"
          retention-days: 14
          if-no-files-found: error
